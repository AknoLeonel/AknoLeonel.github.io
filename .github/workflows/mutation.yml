name: Testes de mutação (Stryker)

on:
  schedule:
    - cron: "23 10 * * 1"   # segundas, 07:23 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-mutacao
          path: reports/mutation/
          retention-days: 14
